<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeVoice Live — NSE Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f14;
    --surface: #131922;
    --surface-alt: #1b232e;
    --border: #26303c;
    --text: #eaf0f5;
    --muted: #8a97a5;
    --up: #3dbd7d;
    --down: #e5564f;
    --accent: #c9a24b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
  }
  .num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand-title { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.2px; }
  .brand-sub { font-size: 0.8rem; color: var(--muted); }
  .brand-sub b { color: var(--accent); font-weight: 500; }

  .controls { display: flex; align-items: center; gap: 18px; }
  .clock { font-size: 0.85rem; color: var(--muted); }
  .clock .num { color: var(--text); }

  .voice-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .voice-toggle span { font-size: 0.82rem; color: var(--muted); }
  .switch { width: 40px; height: 22px; border-radius: 999px; background: var(--surface-alt); border: 1px solid var(--border); position: relative; transition: background 0.2s; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform 0.2s, background 0.2s; }
  .switch.on { background: rgba(201,162,75,0.18); border-color: var(--accent); }
  .switch.on::after { transform: translateX(18px); background: var(--accent); }

  main { padding: 24px; max-width: 1100px; margin: 0 auto; }

  section h2 {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 12px 2px;
    letter-spacing: 0.3px;
  }

  .index-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .stock-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    transition: border-color 0.3s;
  }
  .card.pulse { border-color: var(--accent); }

  .card-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .card-label { font-size: 0.88rem; font-weight: 500; }
  .card-price { font-size: 1.35rem; font-weight: 600; }
  .index-row .card-price { font-size: 1.6rem; }

  .card-change { font-size: 0.85rem; display: flex; gap: 6px; }
  .up { color: var(--up); }
  .down { color: var(--down); }

  .card-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 0.72rem;
    color: var(--muted);
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--muted);
    flex-wrap: wrap;
    gap: 8px;
  }
  .status-bar .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot.live { background: var(--up); }
  .dot.off { background: var(--down); }

  .banner {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .banner code { color: var(--accent); }

  @media (max-width: 480px) {
    header { padding: 16px; }
    main { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-title">TradeVoice Live</div>
    <div class="brand-sub">NSE quotes via <b>Upstox</b> · view only, no order placement</div>
  </div>
  <div class="controls">
    <div class="clock" id="clock">--:--:--</div>
    <label class="voice-toggle">
      <span id="voiceLabel">తెలుగు వాయిస్</span>
      <div class="switch" id="voiceSwitch"></div>
    </label>
  </div>
</header>

<main>
  <div id="configBanner" class="banner" style="display:none;">
    సర్వర్‌లో <code>UPSTOX_ACCESS_TOKEN</code> సెట్ చేయలేదు. <code>.env</code> ఫైల్‌లో లేదా హోస్టింగ్ environment variables లో దాన్ని జోడించండి.
  </div>

  <section>
    <h2>Indexes</h2>
    <div class="index-row" id="indexRow"></div>
  </section>

  <section>
    <h2>Watchlist</h2>
    <div class="stock-grid" id="stockGrid"></div>
  </section>

  <div class="status-bar">
    <div><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span></div>
    <div>Updated <span class="num" id="updatedAt">—</span> · refreshes every 10s</div>
  </div>
</main>

<script>
const REFRESH_MS = 10000;
let voiceOn = false;
let prevPrices = {};

const voiceSwitch = document.getElementById('voiceSwitch');
voiceSwitch.addEventListener('click', () => {
  voiceOn = !voiceOn;
  voiceSwitch.classList.toggle('on', voiceOn);
  if (voiceOn) speak('తెలుగు వాయిస్ ఆన్ అయ్యింది');
});

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'te-IN';
  utter.rate = 0.95;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

function fmt(n, digits = 2) {
  return Number(n ?? 0).toLocaleString('en-IN', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function tick() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-IN', { hour12: false });
}
setInterval(tick, 1000);
tick();

function renderCard(item, big) {
  const dir = item.change >= 0 ? 'up' : 'down';
  const arrow = item.change >= 0 ? '▲' : '▼';
  const pulse = prevPrices[item.label] !== undefined && prevPrices[item.label] !== item.price;
  prevPrices[item.label] = item.price;

  const el = document.createElement('div');
  el.className = 'card' + (pulse ? ' pulse' : '');
  el.innerHTML = `
    <div class="card-top">
      <div class="card-label">${item.label}</div>
    </div>
    <div class="card-price num">₹${fmt(item.price)}</div>
    <div class="card-change ${dir}">
      <span>${arrow} ${fmt(Math.abs(item.change))}</span>
      <span>(${fmt(item.percent)}%)</span>
    </div>
    <div class="card-meta">
      <span>O <span class="num">${fmt(item.open)}</span></span>
      <span>H <span class="num">${fmt(item.high)}</span></span>
      <span>L <span class="num">${fmt(item.low)}</span></span>
    </div>
  `;
  return el;
}

async function loadMarket() {
  try {
    const res = await fetch('/api/market');
    const data = await res.json();

    document.getElementById('configBanner').style.display = data.ok ? 'none' : 'block';

    if (!data.ok) {
      document.getElementById('statusDot').className = 'dot off';
      document.getElementById('statusText').textContent = data.error || 'Error';
      return;
    }

    const indexRow = document.getElementById('indexRow');
    const stockGrid = document.getElementById('stockGrid');
    indexRow.innerHTML = '';
    stockGrid.innerHTML = '';

    (data.indexes || []).forEach(item => indexRow.appendChild(renderCard(item, true)));
    (data.stocks || []).forEach(item => stockGrid.appendChild(renderCard(item, false)));

    document.getElementById('statusDot').className = 'dot live';
    document.getElementById('statusText').textContent = 'Live';
    document.getElementById('updatedAt').textContent = new Date(data.updatedAt).toLocaleTimeString('en-IN', { hour12: false });

    if (voiceOn && data.indexes && data.indexes.length) {
      const nifty = data.indexes.find(i => i.label === 'NIFTY 50');
      if (nifty) {
        const dirWord = nifty.change >= 0 ? 'పెరిగింది' : 'తగ్గింది';
        speak(`నిఫ్టీ యాభై ${fmt(nifty.price, 0)} వద్ద ఉంది, ${dirWord}`);
      }
    }
  } catch (e) {
    document.getElementById('statusDot').className = 'dot off';
    document.getElementById('statusText').textContent = 'Connection failed';
  }
}

loadMarket();
setInterval(loadMarket, REFRESH_MS);
</script>

</body>
</html>
